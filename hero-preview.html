<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview — Solanki Co</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #FCFAF7;
            --bg-card: #E8DFD3;
            --accent: #D4C4B0;
            --text: #1A1C1E;
            --text-mid: rgb(120, 110, 100);
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        h1, h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; }

        /* HEADER (simplified) */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 18px 24px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(252, 250, 247, 0.95);
            backdrop-filter: blur(10px);
        }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .logo-circle {
            width: 36px; height: 36px; background: var(--bg-card); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 300; color: var(--text);
        }
        .logo-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 300; letter-spacing: 3px; color: var(--text); }
        .connect-btn {
            background: var(--text); color: var(--bg); border: 1px solid var(--text);
            font-family: 'Inter', sans-serif; font-size: 0.6rem; font-weight: 400;
            letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 14px;
            text-decoration: none; transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .connect-btn:hover { background: transparent; color: var(--text); }

        /* HERO */
        .hero { min-height: 100vh; position: relative; }
        .hero-panels {
            display: grid; grid-template-columns: 1fr 1fr;
            min-height: 100vh; gap: 0;
        }
        .hero-panel { position: relative; overflow: hidden; }
        .hero-panel-left {
            background: #1A1C1E;
            display: flex; align-items: flex-end; justify-content: flex-start;
            padding: 4rem 3rem;
        }
        .hero-panel-left::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(165deg, rgba(26,28,30,0) 40%, rgba(26,28,30,0.6) 100%),
                radial-gradient(ellipse at 20% 50%, rgba(212,196,176,0.08) 0%, transparent 60%);
        }
        .hero-panel-left::after {
            content: ''; position: absolute; top: 15%; left: 8%;
            width: 1px; height: 120px; background: rgba(212,196,176,0.2);
            animation: heroLineReveal 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 1.5s; opacity: 0;
        }
        @keyframes heroLineReveal { from { opacity: 0; height: 0; } to { opacity: 1; height: 120px; } }

        .hero-panel-right {
            background: #EDE8E3;
            display: flex; align-items: center; justify-content: center;
            padding: 4rem 3rem; position: relative;
        }
        .hero-panel-right::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(180deg, rgba(237,232,227,0) 0%, rgba(237,232,227,0.4) 100%),
                radial-gradient(circle at 70% 30%, rgba(252,250,247,0.5) 0%, transparent 50%);
        }

        .hero-left-content { position: relative; z-index: 1; }
        .hero-mark {
            width: 64px; height: 64px;
            border: 1px solid rgba(212,196,176,0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 2rem;
            opacity: 0; transform: scale(0.85);
            animation: heroMarkReveal 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 0.5s;
        }
        @keyframes heroMarkReveal { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        .hero-mark span { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; color: rgba(252,250,247,0.9); }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 400;
            letter-spacing: clamp(4px, 1vw, 10px); color: #FCFAF7;
            margin-bottom: 0.4rem;
            opacity: 0; animation: heroWordReveal 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; animation-delay: 1s;
        }
        @keyframes heroWordReveal { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .hero-co {
            font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 300;
            color: rgba(252,250,247,0.5); letter-spacing: 2px;
            opacity: 0; animation: heroFadeIn 0.8s ease forwards; animation-delay: 1.6s;
        }
        @keyframes heroFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hero-right-content { position: relative; z-index: 1; max-width: 380px; }
        .hero-eyebrow {
            font-family: 'Inter', sans-serif; font-size: 0.62rem; font-weight: 500;
            letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-mid);
            margin-bottom: 1.5rem;
            opacity: 0; animation: heroFadeIn 0.8s ease forwards; animation-delay: 1.8s;
        }
        .hero-subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.6rem, 2.5vw, 2.2rem); color: var(--text);
            line-height: 1.35; font-weight: 400; margin-bottom: 2rem;
            opacity: 0; animation: heroFadeUp 0.9s ease forwards; animation-delay: 2.2s;
        }
        @keyframes heroFadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hero-divider {
            width: 48px; height: 2px; background: var(--text);
            opacity: 0; animation: heroFadeIn 0.6s ease forwards; animation-delay: 2.6s;
        }

        /* Mobile */
        @media (max-width: 767px) {
            .hero-panels { grid-template-columns: 1fr; }
            .hero-panel-left { min-height: 50vh; padding: 6rem 2rem 3rem; align-items: center; justify-content: center; }
            .hero-left-content { text-align: center; }
            .hero-mark { margin: 0 auto 1.5rem; }
            .hero-panel-right { min-height: 40vh; padding: 3rem 2rem; }
            .hero-right-content { max-width: 100%; text-align: center; }
            .hero-divider { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="#">
            <div class="logo-circle">S</div>
            <span class="logo-name">SOLANKI</span>
        </a>
        <a href="#" class="connect-btn">CONNECT</a>
    </header>

    <section class="hero">
        <div class="hero-panels">
            <div class="hero-panel hero-panel-left">
                <div class="hero-left-content">
                    <div class="hero-mark"><span>S</span></div>
                    <h1>SOLANKI</h1>
                    <div class="hero-co">CO</div>
                </div>
            </div>
            <div class="hero-panel hero-panel-right">
                <div class="hero-right-content">
                    <p class="hero-eyebrow">Foundation · Capital · Advisory · Digital · Studios · Travel</p>
                    <p class="hero-subtitle">Purpose, Capital, and Craft</p>
                    <div class="hero-divider"></div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
